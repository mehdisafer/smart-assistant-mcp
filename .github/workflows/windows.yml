name: windows-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upgrade packaging tooling
        run: python -m pip install --upgrade "pip>=26.2"

      - name: Install
        run: python -m pip install -e ".[test]" bandit pip-audit
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test
        run: python -m pytest -q

      - name: Static security scan
        run: python -m bandit -r src -ll

      - name: Dependency audit
        run: python -m pip_audit --local
